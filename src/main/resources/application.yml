spring:
  application:
    name: prompt-ops

  # 默认内存库，clone 下来就能跑
  # 换 MySQL：把 url/driver 换成 com.mysql.cj.jdbc.Driver 即可
  datasource:
    url: jdbc:h2:mem:promptops;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: false

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

prompt-ops:
  llm:
    # OpenAI 兼容协议，换厂商只改这三行
    base-url: ${LLM_BASE_URL:https://api.deepseek.com/v1}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:deepseek-chat}
    timeout-seconds: 60

    # 没有配 api-key 时自动降级为内置 Mock 模型。
    # 这样任何人都能 clone 下来直接体验完整流程，不花一分钱。
    mock-when-no-key: true

logging:
  level:
    com.pgy.promptops: INFO
